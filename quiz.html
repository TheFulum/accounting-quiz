<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    (function(){const t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t)})();
  </script>
</head>
<body>

<!-- ════════ NAVBAR ════════ -->
<nav class="site-navbar navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <span class="brand-icon">БУ</span>
      Бухгалтерский учёт

    <div class="d-flex align-items-center gap-2 ms-auto">
      <button class="theme-toggle" id="themeToggle" title="Переключить тему"></button>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Меню">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="navbar-nav ms-lg-3 w-100 d-lg-flex align-items-lg-center gap-lg-2">
        <div class="nav-item">
          <a href="#" class="nav-btn" target="_blank">
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2M9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"/></svg>
            Лекции PDF
          </a>
        </div>
        <div class="nav-item">
          <a href="#" class="nav-btn" download>
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/></svg>
            Задачи DOCX
          </a>
        </div>
        <div class="nav-item">
          <button class="nav-btn nav-btn-accent" data-bs-toggle="modal" data-bs-target="#planModal">
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M0 2a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1v7.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 1 12.5V5a1 1 0 0 1-1-1zm2 3v7.5A1.5 1.5 0 0 0 3.5 14h9a1.5 1.5 0 0 0 1.5-1.5V5zm13-3H1v2h14z"/></svg>
            План счётов
          </button>
        </div>
        <div class="nav-item admin-nav-item" style="display:none">
          <a href="admin.html" class="nav-btn nav-btn-admin">

</nav>

<!-- ════════ МОДАЛЬНОЕ — ПЛАН СЧЁТОВ ════════ -->
<div class="modal fade" id="planModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Типовой план счетов бухгалтерского учёта РБ</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <div class="plan-search">
          <span class="si"><svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg></span>
          <input type="text" id="planSearch" placeholder="Поиск по номеру или названию счёта…">
        </div>
        <div class="plan-table-wrap">
          <table class="plan-table">
            <thead><tr><th style="width:80px">Счёт</th><th>Наименование</th><th>Субсчета</th></tr></thead>
            <tbody id="planTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-outline" data-bs-dismiss="modal">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<!-- ════════ ОСНОВНАЯ ОБЛАСТЬ ════════ -->
<div class="container">

  <!-- Загрузка -->
  <div id="loadingArea" class="loading-screen" style="display:flex">
    <div class="spinner"></div>
    <div style="color:var(--text-muted);font-size:0.9rem">Загружаем вопросы…</div>
  </div>

  <!-- Тест -->
  <div id="quizArea" style="display:none">
    <div class="quiz-wrapper">
      <!-- Прогресс -->
      <div class="quiz-header">
        <div class="quiz-progress-label">
          <span class="quiz-progress-text">Вопрос <strong id="progressLabel">1 / 20</strong></span>
          <span class="quiz-timer">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16"><path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71zm4-3H4a.5.5 0 0 0 0 1h1v1a5 5 0 0 0-2.071 9.324.5.5 0 1 0 .521-.854A4 4 0 0 1 5 7V5.5h6V7a4 4 0 0 1-.45 1.87.5.5 0 1 0 .9.43A5 5 0 0 0 13 7V2h1a.5.5 0 0 0 0-1z"/></svg>
            <span id="quizTimer">00:00</span>
          </span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressFill" style="width:5%"></div>
        </div>
      </div>

      <!-- Карточка вопроса -->
      <div class="question-card" id="questionCard"></div>

      <!-- Кнопка -->
      <button class="btn-quiz-next" id="nextBtn" disabled>
        Следующий вопрос →
      </button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/quiz.js"></script>

</body>
</html>
