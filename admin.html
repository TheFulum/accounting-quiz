<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — Бухгалтерский учёт</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Дополнительные стили для адмики ── */
    .admin-toolbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      position: sticky;
      top: 57px;
      z-index: 90;
    }
    .admin-q-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      overflow: hidden;
      transition: box-shadow var(--transition);
    }
    .admin-q-card:hover { box-shadow: var(--shadow-md); }
    .admin-q-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
    }
    .q-toggle {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: none; border: none; cursor: pointer;
      text-align: left; color: var(--text);
      padding: 0; min-width: 0;
    }
    .q-num {
      font-family: var(--font-mono); font-size: 0.74rem;
      color: var(--text-subtle); flex-shrink: 0;
      background: var(--bg-alt); padding: 2px 7px;
      border-radius: var(--radius-pill);
    }
    .q-topic-badge {
      font-size: 0.7rem; font-weight: 600; padding: 2px 8px;
      border-radius: var(--radius-pill); background: var(--accent-light);
      color: var(--accent); flex-shrink: 0; white-space: nowrap;
    }
    .q-preview {
      font-size: 0.86rem; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .q-body { padding: 0 16px 16px; border-top: 1px solid var(--border-light); }
    .q-field-row { margin-bottom: 14px; }
    .q-field-label {
      display: block; font-size: 0.73rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-subtle); margin-bottom: 5px;
    }
    .q-input, .q-textarea {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-input); color: var(--text);
      font-family: var(--font-body); font-size: 0.87rem;
      transition: all var(--transition); resize: vertical;
    }
    .q-input:focus, .q-textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    .options-editor { display: flex; flex-direction: column; gap: 6px; }
    .option-editor-row {
      display: flex; align-items: center; gap: 8px;
    }
    .option-editor-row input[type="radio"] {
      width: 16px; height: 16px; flex-shrink: 0;
      accent-color: var(--accent); cursor: pointer;
    }
    .q-option-input { flex: 1; font-family: var(--font-mono); font-size: 0.85rem; }
    .change-pills-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

    /* Форма добавления */
    .add-form-wrap {
      background: var(--bg-card);
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
    }
    .add-form-title {
      font-family: var(--font-display);
      font-size: 1.05rem; font-weight: 600;
      color: var(--text); margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
    }

    /* Экран авторизации */
    .auth-screen {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; min-height: calc(100vh - 60px);
      padding: 40px 20px;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      max-width: 440px; width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 1.3rem; font-weight: 700;
      color: var(--text); margin-bottom: 6px;
    }
    .auth-hint { font-size: 0.83rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.55; }
    .auth-label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-subtle); margin-bottom: 6px; display: block; }
    .auth-input {
      width: 100%; padding: 10px 14px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-input); color: var(--text);
      font-family: var(--font-mono); font-size: 0.88rem;
      margin-bottom: 12px; transition: all var(--transition);
    }
    .auth-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    .auth-btn {
      width: 100%; padding: 11px; border: none;
      border-radius: var(--radius); background: var(--accent);
      color: white; font-family: var(--font-body);
      font-size: 0.93rem; font-weight: 600; cursor: pointer;
      transition: all var(--transition);
    }
    .auth-btn:hover { background: var(--accent-hover); }

    /* Тост */
    #toastContainer {
      position: fixed; bottom: 24px; right: 24px;
      z-index: 9999; display: flex; flex-direction: column; gap: 8px;
    }
    .unsaved-badge {
      display: none; align-items: center; gap: 5px;
      font-size: 0.76rem; font-weight: 600;
      background: var(--warning-bg); color: var(--warning);
      border: 1px solid var(--warning); padding: 3px 10px;
      border-radius: var(--radius-pill);
    }
    .q-opt-del:hover { background: var(--danger-bg) !important; border-color: var(--danger) !important; }
    @media (max-width: 576px) {
      .admin-q-header { flex-wrap: wrap; }
      .q-preview { display: none; }
    }

    /* ── Кастомный дропдаун тем ── */
    .topic-combo { position: relative; }
    .topic-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      z-index: 200;
      max-height: 220px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .topic-dropdown.open { display: block; }
    .topic-option {
      padding: 10px 14px;
      font-size: 0.87rem;
      color: var(--text);
      cursor: pointer;
      transition: background var(--transition);
      border-bottom: 1px solid var(--border-light);
    }
    .topic-option:last-child { border-bottom: none; }
    .topic-option:hover,
    .topic-option.highlighted { background: var(--accent-light); color: var(--accent); }
    .topic-option mark { background: none; color: var(--accent); font-weight: 700; }
    .topic-dropdown-empty { padding: 10px 14px; font-size: 0.84rem; color: var(--text-subtle); }
  </style>
  <script>
    (function(){const t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t)})();
  </script>
</head>
<body>

<!-- ════════ NAVBAR ════════ -->
<nav class="site-navbar navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <span class="brand-icon">БУ</span>
      Бухгалтерский учёт
    </a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <button class="theme-toggle" id="themeToggle" title="Переключить тему"></button>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Меню">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="navbar-nav ms-lg-3 w-100 d-lg-flex align-items-lg-center gap-lg-2">
        <div class="nav-item"><a href="index.html" class="nav-btn">← Главная</a></div>
        <div class="nav-item"><a href="quiz.html" class="nav-btn nav-btn-accent">Тест</a></div>
        <div class="nav-item">
          <button class="nav-btn" id="logoutBtn">
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/><path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg>
            Выйти
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- ════════ ЭКРАН АВТОРИЗАЦИИ ════════ -->
<div id="authScreen" class="auth-screen" style="display:flex">
  <div class="auth-card">
    <div style="font-size:2rem;margin-bottom:10px">🔐</div>
    <div class="auth-title">Вход в админку</div>
    <div class="auth-hint">
      Введите GitHub Personal Access Token с правами <code>repo</code> или
      откройте страницу по ссылке<br>
      <code style="font-size:0.78rem">admin.html#ghp_ВАШ_ТОКЕН</code>
    </div>
    <label class="auth-label">GitHub PAT</label>
    <input type="password" class="auth-input" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <button class="auth-btn" id="loginBtn">Войти</button>
  </div>
</div>

<!-- ════════ ПАНЕЛЬ АДМИНИСТРАТОРА ════════ -->
<div id="adminPanel" style="display:none">

  <!-- Тулбар -->
  <div class="admin-toolbar">
    <div class="container d-flex align-items-center gap-2 flex-wrap">
      <div style="font-family:var(--font-display);font-size:1rem;font-weight:600;color:var(--text)">
        Управление вопросами
        <span style="font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);font-weight:400;margin-left:6px">
          <span id="questionCount">0</span> вопросов
        </span>
      </div>
      <span class="unsaved-badge" id="unsavedBadge">
        <svg width="11" height="11" fill="currentColor" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8"/></svg>
        Есть несохранённые изменения
      </span>
      <div style="flex:1"></div>
      <div class="position-relative">
        <input type="text" id="adminSearch" class="q-input" style="width:220px;padding-left:32px" placeholder="Поиск вопросов…">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-subtle)">
          <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
        </span>
      </div>
      <button class="nav-btn" id="addQuestionBtn">
        <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/></svg>
        Добавить вопрос
      </button>
      <button class="nav-btn nav-btn-accent" id="saveBtnTop" disabled>
        <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H9.5a1 1 0 0 0-1 1v7.293l2.646-2.647a.5.5 0 0 1 .708.708l-3.5 3.5a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L7.5 9.293V2a2 2 0 0 1 2-2H14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h2.5a.5.5 0 0 1 0 1H2z"/></svg>
        Сохранить изменения
      </button>
    </div>
  </div>

  <div class="container" style="padding-top:20px;padding-bottom:60px">

    <!-- Индикатор загрузки -->
    <div id="loadingIndicator" class="loading-screen" style="display:none;min-height:200px">
      <div class="spinner"></div>
      <div style="color:var(--text-muted);font-size:0.88rem">Загрузка из GitHub…</div>
    </div>

    <!-- Форма добавления нового вопроса -->
    <div id="addFormWrap" class="add-form-wrap" style="display:none">
      <div class="add-form-title">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/></svg>
        Новый вопрос
      </div>
      <form id="newQuestionForm" onsubmit="return false">

        <!-- Текст вопроса -->
        <div class="q-field-row">
          <label class="q-field-label">Текст вопроса *</label>
          <textarea name="q_text" class="q-textarea" rows="3"
            placeholder="Например: Начислена заработная плата рабочим за изготовление продукции"></textarea>
        </div>

        <!-- Тема -->
        <div class="q-field-row">
          <label class="q-field-label">
            Тема *
            <span style="color:var(--text-subtle);font-weight:400;text-transform:none;letter-spacing:0">
              — влияет на балансировку выборки, начни печатать чтобы увидеть существующие
            </span>
          </label>
          <div class="topic-combo" id="topicCombo">
            <input type="text" name="q_topic" id="newTopicInput" class="q-input"
              placeholder="Заработная плата" autocomplete="off">
            <div class="topic-dropdown" id="topicDropdown"></div>
          </div>
        </div>

        <!-- Варианты ответа -->
        <div class="q-field-row">
          <label class="q-field-label">
            Варианты ответа *
            <span style="color:var(--text-subtle);font-weight:400;text-transform:none;letter-spacing:0">
              — отметьте радиокнопку слева у правильного варианта
            </span>
          </label>
          <div class="options-editor" id="newOptionsEditor">
            <div class="option-editor-row new-option-row">
              <input type="radio" name="new_correct" class="new-opt-radio" value="0" checked title="Правильный ответ">
              <input type="text" class="q-input q-option-input new-opt-input" placeholder="Дт 20 — Кт 70">
            </div>
            <div class="option-editor-row new-option-row">
              <input type="radio" name="new_correct" class="new-opt-radio" value="1" title="Правильный ответ">
              <input type="text" class="q-input q-option-input new-opt-input" placeholder="Дт XX — Кт XX">
            </div>
            <div class="option-editor-row new-option-row">
              <input type="radio" name="new_correct" class="new-opt-radio" value="2" title="Правильный ответ">
              <input type="text" class="q-input q-option-input new-opt-input" placeholder="Дт XX — Кт XX">
            </div>
            <div class="option-editor-row new-option-row">
              <input type="radio" name="new_correct" class="new-opt-radio" value="3" title="Правильный ответ">
              <input type="text" class="q-input q-option-input new-opt-input" placeholder="Дт XX — Кт XX">
            </div>
          </div>
          <button type="button" id="addOptionBtn" class="nav-btn" style="margin-top:8px;font-size:0.78rem">
            + Добавить вариант
          </button>
        </div>

        <!-- Правильный тип изменений -->
        <div class="q-field-row">
          <label class="q-field-label">
            Правильный тип изменений балансового уравнения *
          </label>
          <div class="change-pills-row" id="newChangeTypePills">
            <button type="button" class="change-pill new-changetype-btn" data-type="1">1</button>
            <button type="button" class="change-pill new-changetype-btn" data-type="2">2</button>
            <button type="button" class="change-pill new-changetype-btn" data-type="3">3</button>
            <button type="button" class="change-pill new-changetype-btn" data-type="4">4</button>
          </div>
        </div>

        <!-- Варианты типов для показа в тесте (changeTypeOptions) -->
        <div class="q-field-row">
          <label class="q-field-label">
            Варианты типов для выбора в тесте
            <span style="color:var(--text-subtle);font-weight:400;text-transform:none;letter-spacing:0">
              — какие пилюли увидит студент (обычно все четыре)
            </span>
          </label>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:6px">
            <label style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:0.84rem;cursor:pointer;user-select:none">
              <input type="checkbox" name="cto" value="1" checked style="accent-color:var(--accent)"> 1
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:0.84rem;cursor:pointer;user-select:none">
              <input type="checkbox" name="cto" value="2" checked style="accent-color:var(--accent)"> 2
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:0.84rem;cursor:pointer;user-select:none">
              <input type="checkbox" name="cto" value="3" checked style="accent-color:var(--accent)"> 3
            </label>
            <label style="display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:0.84rem;cursor:pointer;user-select:none">
              <input type="checkbox" name="cto" value="4" checked style="accent-color:var(--accent)"> 4
            </label>
          </div>
        </div>

        <!-- Пояснение -->
        <div class="q-field-row">
          <label class="q-field-label">Пояснение к правильному ответу</label>
          <textarea name="q_explanation" class="q-textarea" rows="2"
            placeholder="Правильная бухгалтерская проводка: Дт XX — Кт XX. Объяснение логики."></textarea>
        </div>

        <div style="display:flex;gap:9px;margin-top:8px">
          <button type="button" class="btn-outline" id="cancelAddBtn">Отмена</button>
          <button type="button" class="btn-primary" id="submitNewBtn">
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/></svg>
            Добавить вопрос
          </button>
        </div>
      </form>
    </div>

    <!-- Список вопросов -->
    <div id="questionsList"></div>

  </div>
</div>

<!-- Toast-контейнер -->
<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script>
// Динамическое добавление вариантов ответа
document.getElementById('addOptionBtn')?.addEventListener('click', function () {
  const editor = document.getElementById('newOptionsEditor');
  const count  = editor.querySelectorAll('.new-option-row').length;
  const row    = document.createElement('div');
  row.className = 'option-editor-row new-option-row';
  row.innerHTML =
    '<input type="radio" name="new_correct" class="new-opt-radio" value="' + count + '" title="Правильный ответ">' +
    '<input type="text" class="q-input q-option-input new-opt-input" placeholder="Дт XX — Кт XX">' +
    '<button type="button" onclick="this.closest(\'.new-option-row\').remove()" ' +
    'style="background:none;border:none;cursor:pointer;color:var(--danger);padding:4px 6px;flex-shrink:0;font-size:1rem" title="Удалить">✕</button>';
  editor.appendChild(row);
});
</script>

</body>
</html>
